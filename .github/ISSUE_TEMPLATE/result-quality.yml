name: Result quality
description: Report a selection or brief result that did not meet the documented evidence boundary.
title: "[Quality]: "
labels: ["result-quality"]
body:
  - type: markdown
    attributes:
      value: |
        Summarize the problem. Do not publish complete conversations, private source material, credentials, or customer data.
  - type: dropdown
    id: mode
    attributes:
      label: Mode
      options:
        - Selection only
        - Supplied current topic to brief
        - Selection followed by brief
    validations:
      required: true
  - type: input
    id: host_version
    attributes:
      label: Host and Skill version
      placeholder: Host and exact release version
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
      description: Describe the output shape or behavior you expected.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual quality problem
      description: Provide a short, redacted summary rather than a full transcript.
    validations:
      required: true
  - type: textarea
    id: evidence_boundary
    attributes:
      label: Evidence-boundary concern
      description: Optional. Note any stale data, unsupported claims, topic changes, or missing verification items.
  - type: checkboxes
    id: safety
    attributes:
      label: Public-data confirmation
      options:
        - label: I removed secrets, personal data, client data, and complete conversation content.
          required: true
