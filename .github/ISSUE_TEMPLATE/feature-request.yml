name: Feature request
description: Suggest an improvement for a real creator, research, or editorial workflow.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the real workflow without including credentials, complete conversations, private source material, or customer data.
  - type: textarea
    id: scenario
    attributes:
      label: Real use case
      description: What are you trying to accomplish, and in which host?
    validations:
      required: true
  - type: textarea
    id: blocker
    attributes:
      label: Current obstacle
      description: What is difficult or impossible today?
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Suggested behavior
      description: What outcome would make the workflow better?
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Public-data confirmation
      options:
        - label: I removed secrets, personal data, client data, and complete conversation content.
          required: true
