name: Release Skills

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify tagged commit is on main
        shell: bash
        run: |
          git fetch origin main --no-tags --depth=100
          git merge-base --is-ancestor "$GITHUB_SHA" "origin/main"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify tag matches VERSION
        shell: bash
        run: |
          VERSION="$(cat VERSION)"
          test "${GITHUB_REF_NAME#v}" = "$VERSION"

      - name: Run offline tests
        run: python3 -m unittest discover -s tests -v

      - name: Verify bundled runtime and v0.2.1 eval contract
        run: |
          python3 scripts/sync_skill_runtime.py --check
          python3 scripts/run_host_evals.py --suite v0.2.1 --dry-run

      - name: Verify persistent live Host Eval RC evidence for new releases
        if: ${{ github.ref_name != 'v0.2.1' }}
        run: python3 scripts/verify_release_evidence.py --version "$(cat VERSION)"

      - name: Build deterministic Skill archives
        run: python3 scripts/build_release.py --output dist

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "AI Workstation Topic Intelligence $GITHUB_REF_NAME" \
            --generate-notes
