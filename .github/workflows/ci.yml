name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run offline unit tests
        run: python -m unittest discover -s tests -v
      - name: Check bundled runtime synchronization
        run: python scripts/sync_skill_runtime.py --check
      - name: Compile Python sources
        run: python -m compileall -q scripts skills
      - name: Validate Host Eval suites
        run: python scripts/run_host_evals.py --suite v0.2.1 --dry-run && python scripts/run_host_evals.py --suite v0.3.0 --dry-run
      - name: Validate real Host Eval gate implementation
        run: python -m unittest tests.test_host_eval_runner tests.test_topic_radar_client -q
      - name: Build release archives
        run: python scripts/build_release.py --output /tmp/ati-dist
